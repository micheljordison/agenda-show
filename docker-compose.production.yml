# Standalone file: do not merge with the development Compose file.
services:
  backend:
    image: agenda-backend:${RELEASE_TAG:-production}
    build:
      context: ./backend
      target: production
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: agenda-frontend:${RELEASE_TAG:-production}
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /
    environment:
      BACKEND_UPSTREAM: backend:4050
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
